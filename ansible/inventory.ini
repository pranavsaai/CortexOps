# CortexOps — Ansible Inventory
# Replace IP with your actual server IP or use localhost for local provisioning

[cortexops_servers]
cortexops-host ansible_host=YOUR_SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# For local provisioning (testing on your own machine)
[local]
localhost ansible_connection=local

[all:vars]
ansible_python_interpreter=/usr/bin/python3