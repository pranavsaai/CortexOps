# ============================================================
# HorizontalPodAutoscaler — Auto-scaling
# Scales backend pods 2→10 based on CPU usage
# If CPU > 70%, K8s adds more pods automatically
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cortexops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cortexops-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80