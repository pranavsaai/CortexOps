# ============================================================
# Backend Secret — Groq API Key
# NEVER hardcode API keys — always use K8s Secrets
# Apply with: kubectl apply -f secret.yml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: cortexops-secrets
  namespace: cortexops
type: Opaque
stringData:
  # Plain text here — K8s will base64 encode automatically
  GROQ_API_KEY: "gsk_your_actual_key_here"