# ============================================================
# CortexOps Frontend — Deployment + Service
# Next.js app served with NodePort for external access
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexops-frontend
  namespace: cortexops
  labels:
    app: cortexops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortexops-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cortexops-frontend
    spec:
      containers:
        - name: cortexops-frontend
          image: pranavsaai/cortexops-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: cortexops
spec:
  selector:
    app: cortexops-frontend
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001    # access via http://NODE_IP:30001
  type: NodePort